{% load static %}

<div class="relative w-full h-full group select-none">

    <!-- Image principale affichée -->
    {% if images.object_list %}
        {% with current_img=images.object_list.0 %}
            <img src="{{ current_img.image.url }}" 
                 alt="{{ current_img.alt_text|default:vehicul.modele }}" 
                 class="w-full h-full object-cover object-center transition-transform duration-700 group-hover:scale-105">
        {% endwith %}
    {% else %}
        <img src="{{ vehicul.image_principale.url }}" 
             alt="{{ vehicul.marque.nom }} {{ vehicul.modele }}" 
             class="w-full h-full object-cover object-center transition-transform duration-700 group-hover:scale-105">
    {% endif %}

    <!-- Gradient d'assombrissement pour lisibilité du texte & boutons -->
    <div class="absolute inset-0 bg-gradient-to-t from-slate-950/85 via-slate-950/20 to-slate-950/40 pointer-events-none"></div>

    <!-- BOUTON PRÉCÉDENT (Flèche Gauche) -->
    {% if images.has_previous %}
    <button hx-get="{% url 'vehicul_app:vehicul-image-partial' vehicul.pk|default:vehicule.pk %}?page={{ images.previous_page_number }}"
            hx-target="#hero-image-container"
            hx-swap="innerHTML transition:true"
            aria-label="Image précédente"
            class="absolute left-3 sm:left-6 top-1/2 -translate-y-1/2 z-20 w-10 h-10 sm:w-12 sm:h-12 rounded-full bg-slate-900/50 hover:bg-blue-600 text-white flex items-center justify-center backdrop-blur-md border border-white/20 transition-all duration-300 shadow-xl hover:scale-110 active:scale-95 cursor-pointer group/btn">
        <i class="fas fa-chevron-left text-base sm:text-lg transition-transform group-hover/btn:-translate-x-0.5"></i>
    </button>
    {% else %}
    <button disabled 
            class="absolute left-3 sm:left-6 top-1/2 -translate-y-1/2 z-20 w-10 h-10 sm:w-12 sm:h-12 rounded-full bg-slate-900/20 text-white/30 flex items-center justify-center backdrop-blur-sm border border-white/10 cursor-not-allowed">
        <i class="fas fa-chevron-left text-base sm:text-lg"></i>
    </button>
    {% endif %}

    <!-- BOUTON SUIVANT (Flèche Droite) -->
    {% if images.has_next %}
    <button hx-get="{% url 'vehicul_app:vehicul-image-partial' vehicul.pk|default:vehicule.pk %}?page={{ images.next_page_number }}"
            hx-target="#hero-image-container"
            hx-swap="innerHTML transition:true"
            aria-label="Image suivante"
            class="absolute right-3 sm:right-6 top-1/2 -translate-y-1/2 z-20 w-10 h-10 sm:w-12 sm:h-12 rounded-full bg-slate-900/50 hover:bg-blue-600 text-white flex items-center justify-center backdrop-blur-md border border-white/20 transition-all duration-300 shadow-xl hover:scale-110 active:scale-95 cursor-pointer group/btn">
        <i class="fas fa-chevron-right text-base sm:text-lg transition-transform group-hover/btn:translate-x-0.5"></i>
    </button>
    {% else %}
    <button disabled 
            class="absolute right-3 sm:right-6 top-1/2 -translate-y-1/2 z-20 w-10 h-10 sm:w-12 sm:h-12 rounded-full bg-slate-900/20 text-white/30 flex items-center justify-center backdrop-blur-sm border border-white/10 cursor-not-allowed">
        <i class="fas fa-chevron-right text-base sm:text-lg"></i>
    </button>
    {% endif %}

    <!-- COMPTEUR DE PAGES/PHOTOS (Haut Droit) -->
    <div class="absolute top-20 right-4 sm:top-20 sm:right-8 z-20 px-3.5 py-1.5 rounded-full bg-slate-900/60 backdrop-blur-md border border-white/20 text-white text-xs sm:text-sm font-semibold flex items-center gap-2 shadow-lg">
        <i class="fas fa-camera text-blue-400 text-xs"></i>
        <span>{{ images.number }} / {{ images.paginator.num_pages }}</span>
    </div>

</div>
