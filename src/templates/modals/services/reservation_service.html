<!-- Modale (DaisyUI / Tailwind) -->
<dialog id="modal_reserver_service" class="modal">
  <div class="modal-box max-w-lg w-full p-6">
    
    <!-- En-tête de la modale -->
    <div class="flex justify-between items-center pb-3 mb-4 border-b">
      <h3 class="font-bold text-lg text-gray-800">Sélection du véhicule</h3>
      <form method="dialog">
        <button class="btn btn-sm btn-circle btn-ghost">✕</button>
      </form>
    </div>

    <!-- Formulaire HTMX -->
    <form hx-post="{% url 'services_app:reserver-service' service.pk %}" 
          hx-target="#modal_reserver_service" 
          hx-swap="outerHTML" 
          hx-indicator="#submit-spinner"
          class="space-y-4">
      
      {% csrf_token %}

      <!-- Choix Origine -->
      <div class="form-control">
        <label class="label font-semibold">{{ reserver_service_form.origine.label }}</label>
        <div class="flex items-center gap-4">
          {{ reserver_service_form.origine }}
        </div>
      </div>

      <!-- Bloc Véhicule KOZ -->
      <div id="bloc-vehicul-koz" class="form-control hidden">
        <label class="label font-semibold">{{ reserver_service_form.vehicul.label }}</label>
        {{ reserver_service_form.vehicul }}
      </div>

      <!-- Bloc Véhicule Externe -->
      <div id="bloc-vehicul-externe" class="hidden space-y-3">
        <div class="grid grid-cols-2 gap-3">
          <div class="form-control">
            <label class="label text-xs font-medium">{{ reserver_service_form.marque.label }}</label>
            {{ reserver_service_form.marque }}
          </div>
          <div class="form-control">
            <label class="label text-xs font-medium">{{ reserver_service_form.modele.label }}</label>
            {{ reserver_service_form.modele }}
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div class="form-control">
            <label class="label text-xs font-medium">{{ reserver_service_form.annee.label }}</label>
            {{ reserver_service_form.annee }}
          </div>
          <div class="form-control">
            <label class="label text-xs font-medium">{{ reserver_service_form.immatriculation.label }}</label>
            {{ reserver_service_form.immatriculation }}
          </div>
        </div>
      </div>

      <!-- Actions & Loader HTMX -->
      <div class="modal-action border-t pt-4 mt-6">
        <button type="button" 
                class="btn btn-ghost" 
                onclick="document.getElementById('modal_reserver_service').close()">
          Annuler
        </button>

        <button type="submit" class="btn btn-primary min-w-[120px]">
          <span id="submit-spinner" class="loading loading-spinner loading-xs htmx-indicator"></span>
          <span>Enregistrer</span>
        </button>
      </div>

    </form>
  </div>
</dialog>

<script>
    document.addEventListener('CloseReservationModal'){
        document.getElementById('modal_reserver_service').close()
    }
</script>
<script>
    // Délégation d'événement pour que le toggle fonctionne même après un rechargement HTMX
    document.addEventListener('change', function(e) {
        if (e.target && e.target.name === 'origine') {
            const isKoz = e.target.value === 'koz';
            const isExterne = e.target.value === 'externe';
            
            document.getElementById('bloc-vehicul-koz')?.classList.toggle('hidden', !isKoz);
            document.getElementById('bloc-vehicul-externe')?.classList.toggle('hidden', !isExterne);
        }
    });
</script>
