# ========== Redirection HTTP → HTTPS ==========
server {
    listen 80;
    listen [::]:80;
    server_name koz-corporate.pro www.koz-corporate.pro; # 🟢 Coquille .pr corrigée

    # Permet le renouvellement automatique des certificats Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirection propre en conservant le nom d'hôte exact ($host au lieu de $server_name)
    location / {
        return 301 https://$host$request_uri;
    }
}

# ========== Serveur HTTPS ==========
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name koz-corporate.pro www.koz-corporate.pro;

    # ========== SSL ==========
    ssl_certificate /etc/letsencrypt/live/koz-corporate.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/koz-corporate.pro/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # ========== Sécurité globale ==========
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ========== Fichiers statiques ==========
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Vary Accept-Encoding;
        
        # Ré-application des en-têtes de sécurité pour contourner le piège d'héritage Nginx
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ========== Fichiers média ==========
    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public";
        autoindex off;

        add_header X-Content-Type-Options "nosniff" always;
    }

    # ========== Limite taille upload (Images/Médias) ==========
    client_max_body_size 100M;

    # ========== Proxy vers Django ==========
    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Timeouts pour uploads volumineux
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # ========== Healthcheck ==========
    location /health/ {
        proxy_pass http://web:8000/health/;
        access_log off;
    }

    # ========== Blocage fichiers sensibles ==========
    location ~ /\. {
        deny all;
    }

    location ~ /db/ {
        deny all;
    }
}