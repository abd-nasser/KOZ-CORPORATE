 <!-- Modal de Demande de Rendez-vous -->
    <dialog id="modal_demande_rdv" class="modal modal-bottom sm:modal-middle">
        <div class="modal-box bg-white p-6 sm:p-8 rounded-3xl border border-slate-200 max-w-lg">
            <form method="dialog">
                <button class="btn btn-sm btn-circle btn-ghost absolute right-4 top-4 text-slate-400">✕</button>
            </form>

            <div class="flex items-center gap-3 mb-6">
                <div class="w-10 h-10 bg-blue-50 rounded-xl flex items-center justify-center text-blue-600 font-bold">
                    <i class="fas fa-calendar-plus"></i>
                </div>
                <div>
                    <h3 class="font-extrabold text-slate-900 text-lg">Solliciter un Rendez-vous</h3>
                    <p class="text-xs text-slate-500">Choisissez le créneau qui vous convient le mieux.</p>
                </div>
            </div>

            <form 
            method="post" 
            class="space-y-4"
            action="{% url 'client_app:client-create-rdv' %}">
                {% csrf_token %}

                <div class="space-y-1.5">
                    <label class="text-xs font-bold text-slate-700">Date et heure souhaitées</label>
                    {{ rdv_form.date_rendez_vous }}
                </div>

                <div class="grid grid-cols-1 gap-3">
                    <div class="space-y-1.5">
                        <label class="text-xs font-bold text-slate-700">Durée (minutes)</label>
                        {{ rdv_form.duree }}
                    </div>
                   
                </div>
                <div class="grid grid-cols-1 gap-5">
                 <div class="space-y-1.5">
                        <label class="text-xs font-bold text-slate-700">Objet / Motif</label>
                        {{ rdv_form.motif }}
                    </div>
                </div>

                <div class="pt-4 border-t border-slate-100 flex gap-3">
                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-xl text-xs shadow-md shadow-blue-600/20 transition-all">
                        Envoyer la demande
                    </button>
                </div>
            </form>
        </div>
        <form method="dialog" class="modal-backdrop">
            <button>Fermer</button>
        </form>
    </dialog>
